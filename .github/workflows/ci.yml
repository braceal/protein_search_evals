name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Synchronize locked environment
        run: uv sync --locked --extra dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Build package
        run: uv build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Synchronize locked environment
        run: uv sync --locked --only-group docs

      - name: Build documentation strictly
        run: uv run --no-sync properdocs build --strict
