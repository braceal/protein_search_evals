# Replace PROJECT and the input/output paths for your LCRC allocation.
input_dir: /lcrc/project/PROJECT/data/proteins
output_dir: /lcrc/project/PROJECT/genslm-embeddings/esm2-8M

glob_patterns:
  - '*.fasta'

encoder_config:
  name: esm2
  pretrained_model_name_or_path: facebook/esm2_t6_8M_UR50D
  normalize_pooled_embeddings: true
  dataloader_batch_size: 8

compute_config:
  name: swing
  account: PROJECT
  queue: gpu
  walltime: '04:00:00'
  init_blocks: 1
  min_blocks: 0
  max_blocks: 4
  worker_init: |
    cd "$PBS_O_WORKDIR"
    source .venv/bin/activate
