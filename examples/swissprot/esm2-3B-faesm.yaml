# Directory containing the input files to embed.
input_dir: /lus/eagle/projects/FoundEpidem/braceal/projects/kbase-protein-search/data/uniprot_2025_02/sprot

# Directory to save the embeddings.
output_dir: /lus/eagle/projects/FoundEpidem/braceal/projects/kbase-protein-search/data/uniprot_2025_02/sprot-embeddings/esm3-3B_faesm_embeddings

# Glob patterns to match the input files.
glob_patterns:
  - "*.fasta"

# Configuration for the encoder.
encoder_config:
  # The encoder name
  name: esm2
  # The model name or path to the pretrained model.
  pretrained_model_name_or_path: facebook/esm2_t36_3B_UR50D
  # The precision to use for the model
  half_precision: true
  # Whether to use the faesm implementation (faster).
  enable_faesm: true
  # Whether to normalize the embeddings
  normalize_pooled_embeddings: true
  # The batch size to use for embedding
  dataloader_batch_size: 128
  # The prefetch factor to use for embedding
  dataloader_prefetch_factor: 8
  # The number of data workers to use for embedding
  dataloader_num_data_workers: 8
  # Verbose embedding progress
  verbose: true

# Compute settings can be configured by referring to protein_search_evals/parsl.py
# The `name` field specifies what type of system to run on and the subsequent
# arguments are conditional on the name field (e.g., a cluster may have different
# configuration than a workstation).
compute_config:
  # Specify we want the Polaris headless parsl configuration
  name: polaris_headless
  # Number of nodes to use (must use at least 1 nodes).
  # NOTE: Also requires updating the submit script to request the correct number of nodes.
  num_nodes: 2
